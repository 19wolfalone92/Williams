[pytest]
# These three files are operational smoke scripts, not pytest test modules.
# Importing them performs environment-dependent work (local runtime DB checks
# or authenticated Binance Spot Testnet reads). Keep them out of automatic
# collection; run them explicitly with Python when their prerequisites exist.
addopts =
    --ignore=safe_smoke_test.py
    --ignore=test_scanner_trader_dry_run.py
    --ignore=test_selected_symbol_prepare.py
