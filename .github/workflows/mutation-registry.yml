name: Enforced Mutation Registry

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-registry-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  mutation-registry:
    name: Source-to-sink mutation gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Verify registry and negative fixtures
        run: |
          python -m py_compile mutation_registry_gate.py test_mutation_registry_gate.py
          python -m pytest -q test_mutation_registry_gate.py
      - name: Enforce production mutation registry
        run: python mutation_registry_gate.py
