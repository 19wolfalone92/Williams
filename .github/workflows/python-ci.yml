name: Python backend tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Compile production Python
        run: |
          python -m py_compile             strategy.py data.py risk_engine.py db.py binance_client.py binance_rules.py preflight_gate.py             market_scanner.py wave_engine.py portfolio_scanner.py             portfolio_controller.py trader.py server.py ws_hub.py trading_config.py market_context.py execution_barrier.py wise_men.py l2_slippage.py equity_breaker.py mtf_context_service.py hypothesis_engine.py execution_accumulator.py             feature_store.py ai_shadow.py cpcv_backtester.py stress_suite.py mock_exchange.py quant_models.py shap_explain.py derivatives_features.py shadow_execution.py quant_ml_pipeline.py

      - name: Validate AI-Forge Core
        env:
          AI_FORGE_MOCK: "true"
          AI_FORGE_API_TOKEN: ci-test-token
        run: |
          python -m pip install -r ai_forge/requirements.txt
          python -m compileall -q ai_forge
          python -m pytest -q ai_forge/tests
          docker build -f ai_forge/Dockerfile -t ai-forge-core:ci ai_forge
          docker run -d --rm --name ai-forge-smoke -e AI_FORGE_MOCK=true -e AI_FORGE_API_TOKEN=ci-test-token -p 8787:8787 ai-forge-core:ci
          trap "docker stop ai-forge-smoke >/dev/null 2>&1 || true" EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8787/health && exit 0; sleep 1; done
          docker logs ai-forge-smoke
          exit 1

      - name: Run full static safety audit
        run: python full_safety_audit.py

      - name: Run safe offline tests
        run: >-
          python -m pytest -q
          test_production_architecture.py
          test_l2_slippage.py
          test_hypothesis_engine.py
          test_market_scanner.py
          test_wave_engine.py
          test_dynamic_scanner.py
          test_portfolio_controller.py
          test_multi_position_risk.py
          test_multi_position_execution.py
          test_portfolio_integration.py
          test_portfolio_scanner.py
          test_portfolio_scanner_atr.py
          test_risk_engine.py
          test_strategy_diagnostics.py
          test_db_guard.py
          test_db_isolation.py
          test_atomic_real_db.py
          test_atomic_switch_db_failure.py
          test_atomic_switch_rollback.py
          test_buy_safety.py
          test_williams_book_alignment.py
          test_book_wave_safety.py test_trade_journal.py
          test_multi_position_lifecycle.py
          recovery_test.py
          recovery_oco_failure_test.py
          test_chaos_hardening.py
          test_wave_safety_fields.py
          test_binance_market_data.py
          test_binance_json_shapes.py
          tests/test_quant_layer.py
          tests/test_quant_models.py
          test_preflight_gate.py test_execution_architecture.py
