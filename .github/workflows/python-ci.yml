name: Python backend tests

on:
  push:
    branches: [main, master, futures-williams-campaign]
    paths:
      - "*.py"
      - "tests/**"
      - "docs/williams_book_rule_registry.json"
      - "tools/audit_book_rule_registry.py"
      - "app/src/test/resources/williams_book_rules_contract.json"
      - "requirements.txt"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "*.py"
      - "tests/**"
      - "docs/williams_book_rule_registry.json"
      - "tools/audit_book_rule_registry.py"
      - "app/src/test/resources/williams_book_rules_contract.json"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  # Each commit validates its exact source tree.
  group: backend-ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest ruff

      - name: Check undefined names and syntax
        run: python -m ruff check --select F821,F822,F823,E9 .
      - name: Run release contract gate
        run: python3 ci_release_gate.py

      - name: Validate book source and regression links (not whole-book approval)
        run: python3 tools/audit_book_rule_registry.py

      - name: Compile production Python
        run: |
          python -m py_compile             futures_williams_runtime.py campaign_model.py campaign_engine.py williams_signals.py williams_paper_replay.py run_williams_h1_paper_replay.py strategy.py data.py risk_engine.py db.py binance_client.py binance_rules.py preflight_gate.py             market_scanner.py wave_engine.py portfolio_scanner.py             portfolio_controller.py trader.py server.py ws_hub.py trading_config.py market_context.py execution_barrier.py wise_men.py l2_slippage.py equity_breaker.py mtf_context_service.py hypothesis_engine.py execution_accumulator.py             feature_store.py ai_shadow.py cpcv_backtester.py stress_suite.py mock_exchange.py quant_models.py shap_explain.py derivatives_features.py shadow_execution.py quant_ml_pipeline.py

      - name: Run full static safety audit
        run: python full_safety_audit.py

      - name: Run safe offline tests
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee pytest-output.txt

      - name: Reproduce fifteen sealed Binance H1 paper campaigns (NOT OOS or exchange fill)
        run: |
          mkdir -p build/frozen-h1-replay
          python tools/replay_frozen_h1_five_symbol.py --outdir build/frozen-h1-replay

      - name: Upload fifteen-symbol historical TC2 campaigns and stress results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: williams-frozen-fifteen-h1-trades-and-stress
          path: build/frozen-h1-replay/
          if-no-files-found: warn
          retention-days: 21

      - name: Replay genuine historical wave price geometry (NOT human-labelled accuracy)
        run: |
          mkdir -p build/wave-audit
          python tools/replay_real_historical_recursive_cases.py --output build/wave-audit/real_exchange_price_grammar.json
          python tools/audit_independent_wave_labels.py --output build/wave-audit/independent_wave_truth_gate.json
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("build/wave-audit/independent_wave_truth_gate.json").read_text())
          assert a["accuracy_certified"] is False
          assert a["status"]=="NOT_MEASURABLE_NO_INDEPENDENT_LABELS"
          print("No independent ground truth: explicit, truthful NOT_MEASURABLE gate")
          PY

      - name: Upload wave truth and historical replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: williams-wave-independent-truth-gate
          path: build/wave-audit/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Blind 30-slice Binance H1 wave benchmark (rule proxy, NOT expert labels)
        run: |
          mkdir -p build/blind-wave-review
          python tools/benchmark_blind_30_h1_wave_cases.py --output build/blind-wave-review --charts
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("build/blind-wave-review/model_vs_proxy_results.json").read_text())["metrics"]
          assert m["snapshot_count"]==30
          assert m["independent_expert_annotations"]==0
          assert m["accuracy_vs_human_expert"] is None
          print("Price-grammar proxy only; no independent human Elliott accuracy certified.")
          PY

      - name: Export separate sealed human review packet without model/proxy labels
        run: |
          python tools/export_blind_human_wave_packet.py \
            --source build/blind-wave-review/blind_reference_frozen.json \
            --charts build/blind-wave-review \
            --output build/blind-human-review

      - name: Upload blinded chart-only independent expert packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: williams-blind-h1-expert-annotation-packet
          path: build/blind-human-review/
          if-no-files-found: warn
          retention-days: 21

      - name: Archive 30 blind historical charts, scores and source IDs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: williams-blind-wave-30-real-h1-review
          path: build/blind-wave-review/
          if-no-files-found: warn
          retention-days: 21

      - name: Blind 90 H1 wave snapshots on 15 frozen assets (NOT expert accuracy)
        run: |
          mkdir -p build/blind-wave-review-90
          python tools/benchmark_blind_30_h1_wave_cases.py \
            --output build/blind-wave-review-90 --all-fifteen --charts
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("build/blind-wave-review-90/model_vs_proxy_results.json").read_text())["metrics"]
          assert m["snapshot_count"]==90 and len(m["instruments"])==15
          assert m["independent_expert_annotations"]==0
          assert m["accuracy_vs_human_expert"] is None
          assert not m["can_place_orders"] and not m["can_close"]
          PY

      - name: Upload 15-asset 90-slice wave charts and proxy analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: williams-blind-90-h1-15-asset-no-human-labels
          path: build/blind-wave-review-90/
          if-no-files-found: warn
          retention-days: 21

      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-pytest-report
          path: pytest-output.txt
          if-no-files-found: warn
          retention-days: 7
