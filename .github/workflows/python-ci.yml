name: Python backend tests

on:
  push:
    branches: [main, master]
    paths:
      - "*.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "*.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  # Each commit validates its exact source tree.
  group: backend-ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Run release contract gate
        run: python3 ci_release_gate.py

      - name: Compile production Python
        run: |
          python -m py_compile             strategy.py data.py risk_engine.py db.py binance_client.py binance_rules.py preflight_gate.py             market_scanner.py wave_engine.py portfolio_scanner.py             portfolio_controller.py trader.py server.py ws_hub.py trading_config.py market_context.py execution_barrier.py wise_men.py l2_slippage.py equity_breaker.py mtf_context_service.py hypothesis_engine.py execution_accumulator.py             feature_store.py ai_shadow.py cpcv_backtester.py stress_suite.py mock_exchange.py quant_models.py shap_explain.py derivatives_features.py shadow_execution.py quant_ml_pipeline.py order_state_machine.py pending_signal.py decision_trace.py recovery_matrix.py stop_engine.py

      - name: Run full static safety audit
        run: python full_safety_audit.py

      - name: Run safe offline tests
        run: |
          set -o pipefail
          python -m pytest -q \
            test_production_architecture.py \
            test_android_remote_only.py \
            test_l2_slippage.py \
            test_hypothesis_engine.py \
            test_market_scanner.py \
            test_wave_engine.py \
            test_dynamic_scanner.py \
            test_portfolio_controller.py \
            test_multi_position_risk.py \
            test_multi_position_execution.py \
            test_portfolio_scanner.py \
            test_portfolio_scanner_atr.py \
            test_risk_engine.py \
            test_strategy_diagnostics.py \
            test_db_guard.py \
            test_db_isolation.py \
            test_atomic_real_db.py \
            test_atomic_switch_db_failure.py \
            test_atomic_switch_rollback.py \
            test_buy_safety.py \
            test_williams_book_alignment.py \
            test_book_wave_safety.py \
            test_trade_journal.py \
            test_multi_position_lifecycle.py \
            recovery_test.py \
            recovery_oco_failure_test.py \
            test_chaos_hardening.py \
            test_wave_safety_fields.py \
            test_binance_market_data.py \
            test_binance_json_shapes.py \
            tests/test_quant_layer.py \
            tests/test_quant_models.py \
            test_preflight_gate.py \
            test_execution_architecture.py \
            test_integration_bindings.py \
            test_testnet_release_gate.py \
            test_execution_components.py \
            2>&1 | tee pytest-output.txt

      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-pytest-report
          path: pytest-output.txt
          if-no-files-found: warn
          retention-days: 7
