name: Binance USD-M Futures Demo read-only gate

on:
  push:
    branches: [futures-williams-campaign, fix/book-exact-short-wm3-ticks-20261026, fix/ntd-no-phantom-position-book-exit-replay-20261028, test/testnet-public-market-smoke-20261028]
  workflow_dispatch:
    inputs:
      symbol:
        description: "USD-M Futures USDT-M symbol for authenticated preflight"
        required: true
        default: "BTCUSDT"
        type: string

permissions:
  contents: read

jobs:
  testnet-read-only:
    name: Binance USD-M Futures Demo preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TESTNET: "true"
      ALLOW_LIVE: "false"
      WILLIAMS_TESTNET_E2E: "1"
      BINANCE_API_KEY: ${{ secrets.WILLIAMS_TESTNET_API_KEY }}
      BINANCE_API_SECRET: ${{ secrets.WILLIAMS_TESTNET_API_SECRET }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate repository release contract
        run: python3 ci_release_gate.py

      - name: Probe real public USD-M Futures Demo clock, contracts and closed H1 on all 10 pairs
        run: python3 tools/verify_public_futures_demo.py

      - name: Check optional CI Demo credentials
        id: check-ci-testnet-credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${BINANCE_API_KEY}" && -n "${BINANCE_API_SECRET}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "::notice::CI Demo credentials are present; authenticated read-only gate will run."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Authenticated Futures Demo read-only gate skipped: repository Actions secrets are not configured. This is separate from credentials saved locally in the Android app."
          fi

      - name: Run authenticated Futures Demo read-only gate
        if: steps.check-ci-testnet-credentials.outputs.configured == 'true'
        run: python test_testnet_release_gate.py --read-only
        env:
          TESTNET_SYMBOL: ${{ inputs.symbol || 'BTCUSDT' }}

      - name: Report skipped authenticated gate on normal branch push
        if: github.event_name != 'workflow_dispatch' && steps.check-ci-testnet-credentials.outputs.configured != 'true'
        run: echo "::warning::No signed Binance Demo verification occurred; this is NOT a Testnet release acceptance."

      - name: Fail explicit signed Demo acceptance when credentials are missing
        if: github.event_name == 'workflow_dispatch' && steps.check-ci-testnet-credentials.outputs.configured != 'true'
        run: |
          echo "::error::Authenticated read-only Futures Demo evidence is REQUIRED for explicit acceptance."
          exit 1
