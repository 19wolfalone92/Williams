name: Binance USD-M Futures Demo read-only gate

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "USD-M Futures USDT-M symbol for authenticated preflight"
        required: true
        default: "BTCUSDT"
        type: string

permissions:
  contents: read

jobs:
  testnet-read-only:
    name: Binance USD-M Futures Demo preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TESTNET: "true"
      ALLOW_LIVE: "false"
      WILLIAMS_TESTNET_E2E: "1"
      BINANCE_API_KEY: ${{ secrets.WILLIAMS_TESTNET_API_KEY }}
      BINANCE_API_SECRET: ${{ secrets.WILLIAMS_TESTNET_API_SECRET }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate repository release contract
        run: python3 ci_release_gate.py

      - name: Validate secret presence without printing values
        run: |
          set -euo pipefail
          test -n "${BINANCE_API_KEY}" || { echo "::error::WILLIAMS_TESTNET_API_KEY is not configured."; exit 1; }
          test -n "${BINANCE_API_SECRET}" || { echo "::error::WILLIAMS_TESTNET_API_SECRET is not configured."; exit 1; }

      - name: Run authenticated Futures Demo read-only gate
        run: python test_testnet_release_gate.py --read-only
        env:
          TESTNET_SYMBOL: ${{ inputs.symbol }}
