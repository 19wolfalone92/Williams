name: Temporary source snapshot
on:
  push:
    branches: [main]
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package source
        run: |
          rm -rf .git data .signing
          rm -f .env
          zip -qr /tmp/williams-source.zip . -x '*.pyc' '__pycache__/*' '.gradle/*' 'build/*' 'app/build/*'
      - uses: actions/upload-artifact@v4
        with:
          name: williams-source-snapshot
          path: /tmp/williams-source.zip
          retention-days: 1