name: TC2 2025 closed H1-H4-D1 external-year robustness (research only)

on:
  push:
    paths:
      - 'research/data_2025/**'
      - 'research/tc2_external_2025_validation.py'
      - 'research/tc2_context_walkforward.py'
      - 'tests/test_tc2_external_2025_validation.py'
      - '.github/workflows/tc2-external-2025.yml'
  pull_request:
    paths:
      - 'research/data_2025/**'
      - 'research/tc2_external_2025_validation.py'
      - 'research/tc2_context_walkforward.py'
      - 'tests/test_tc2_external_2025_validation.py'
      - '.github/workflows/tc2-external-2025.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-2025-external:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout read-only public 2025 Binance Futures OHLCV
        uses: actions/checkout@v4
      - name: Standard Python 3.12, no private exchange credentials
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research test runner (no exchange SDK)
        run: python -m pip install 'pytest==8.3.5'
      - name: Assert all ten 2025 public Binance H1 H4 D1 archives are causally closed
        run: python -m pytest -q tests/test_tc2_external_2025_validation.py
      - name: Replay frozen 2026 source rules on reverse-time 2025 calendar
        run: |
          PYTHONPATH=. python research/tc2_external_2025_validation.py \
            --data research/data_2025 \
            --output build/tc2_context_external_2025.json
      - name: Audit complete ten-symbol reporting and no trading authority
        run: |
          python - <<'PY'
          import json
          p=json.load(open("build/tc2_context_external_2025.json"))
          assert p["frozen_closed_bar_count"]==113150
          assert p["execution_authority"] is False
          assert p["fills_certified"] is False
          assert p["not_a_prospective_holdout"] is True
          assert p["source_2026_decision_rules_unchanged"] is True
          assert len(p["symbols"])==10
          assert list(p["quarters"])==["2025-Q1","2025-Q2","2025-Q3","2025-Q4"]
          assert sum(p["quarters"][q]["all_candidates"] for q in p["quarters"])==p["overall"]["all_candidates"]
          assert sum(p["symbols"][s]["events"]["all_candidates"] for s in p["symbols"])==p["overall"]["all_candidates"]
          for ctx in ("h4_d1_only","h4_swing_confirmed","h4_and_d1_swings_confirmed"):
              c=p["overall"][ctx]
              for h in (6,24):
                  for n in (3,5):
                      a=c[f"{h}h_stop{n}"];b=c[f"{h}h_trail{n}"]
                      assert a["n"]==b["n"]
                      assert a["win"]+a["loss"]<=a["n"]
                      assert b["win"]+b["loss"]<=b["n"]
          print("2025 external research: complete, source-frozen, not live-authorized")
          PY
      - name: Upload machine-readable research evidence
        uses: actions/upload-artifact@v4
        with:
          name: tc2-external-2025-robustness-json
          path: build/tc2_context_external_2025.json
          retention-days: 30
          if-no-files-found: error
