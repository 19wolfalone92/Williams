name: Build Android APK
# 4.21 quant shadow layer integration + final APK validation
# Credential-status compatibility fix validation
# CI refresh: validate current main tree after Binance JSON-shape and risk-budget fixes

on:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '8.13'
  ANDROID_PLATFORM: 'platforms;android-36'
  ANDROID_BUILD_TOOLS: 'build-tools;36.0.0'

jobs:
  build-apk:
    name: Build APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "${ANDROID_PLATFORM}" "${ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          validate-wrappers: false

      - name: Restore persistent debug signing key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.WILLIAMS_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail

          if [ -z "${DEBUG_KEYSTORE_B64:-}" ]; then
            echo "::error::WILLIAMS_DEBUG_KEYSTORE_B64 GitHub Secret is not configured."
            echo "The debug APK must use a persistent signing key."
            exit 1
          fi

          mkdir -p build

          printf '%s' "$DEBUG_KEYSTORE_B64" \
            | base64 --decode > build/williams-debug.p12

          chmod 600 build/williams-debug.p12

          echo "Persistent debug keystore restored."

      - name: Validate debug signing configuration
        env:
          WILLIAMS_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.WILLIAMS_DEBUG_KEYSTORE_PASSWORD }}
          WILLIAMS_DEBUG_KEYSTORE_B64: ${{ secrets.WILLIAMS_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail

          test -s build/williams-debug.p12

          echo "Debug signing material: PRESENT"

      - name: Validate quant Python sources
        run: |
          set -euo pipefail
          python3 -m py_compile             feature_store.py ai_shadow.py cpcv_backtester.py             stress_suite.py mock_exchange.py quant_models.py             shap_explain.py derivatives_features.py shadow_execution.py             quant_ml_pipeline.py
          echo "Quant Python syntax: PASS"

      - name: Quant integration marker
        run: |
          set -euo pipefail
          test -f feature_store.py
          test -f ai_shadow.py
          test -f cpcv_backtester.py
          test -f stress_suite.py
          test -f mock_exchange.py
          test -f quant_models.py
          test -f shap_explain.py
          test -f derivatives_features.py
          test -f shadow_execution.py
          test -f quant_ml_pipeline.py
          echo "Quant shadow layer sources present; Android remains a cockpit/runtime build."

      - name: Run Android unit tests
        run: |
          set +e
          gradle --no-daemon :app:testDebugUnitTest --stacktrace 2>&1 | tee android-unit-tests.log
          rc=${PIPESTATUS[0]}
          set -e
          exit "$rc"

      - name: Upload Android unit-test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: williams-android-unit-test-diagnostics-${{ github.run_number }}
          path: |
            android-unit-tests.log
            app/build/test-results/testDebugUnitTest/**/*.xml
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Run Android lint (advisory)
        continue-on-error: true
        timeout-minutes: 2
        run: |
          set -euo pipefail
          gradle --no-daemon :app:lintDebug --stacktrace

      - name: Build debug APK
        env:
          WILLIAMS_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.WILLIAMS_DEBUG_KEYSTORE_PASSWORD }}
          WILLIAMS_DEBUG_KEYSTORE_B64: ${{ secrets.WILLIAMS_DEBUG_KEYSTORE_B64 }}
        run: |
          set +e
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee build-debug.log
          rc=${PIPESTATUS[0]}
          set -e
          exit "$rc"

      - name: Upload debug build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: williams-debug-build-log-${{ github.run_number }}
          path: build-debug.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Build release APK
        run: |
          gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Verify APK files
        run: |
          set -euo pipefail

          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          test -f "$DEBUG_APK"
          test -f "$RELEASE_APK"

          echo "=== APK files ==="
          ls -lh "$DEBUG_APK" "$RELEASE_APK"

      - name: Inspect APK metadata
        run: |
          set -euo pipefail

          echo "=== DEBUG APK ==="
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging \
            app/build/outputs/apk/debug/app-debug.apk \
            | grep -E "package:|sdkVersion:|targetSdkVersion:"

          echo
          echo "=== RELEASE APK ==="
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            | grep -E "package:|sdkVersion:|targetSdkVersion:"

      - name: Verify persistent debug keystore
        run: |
          set -euo pipefail
          test -s build/williams-debug.p12
          echo "Persistent debug PKCS12 keystore: PRESENT"

      - name: Verify persistent debug APK signature
        env:
          WILLIAMS_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.WILLIAMS_DEBUG_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          KEYTOOL="$JAVA_HOME/bin/keytool"

          test -f "$APK"
          test -f "$APKSIGNER"
          test -f "build/williams-debug.p12"

          KEYSTORE_SHA="$("$KEYTOOL" -list -v             -keystore build/williams-debug.p12             -storetype PKCS12             -storepass "$WILLIAMS_DEBUG_KEYSTORE_PASSWORD"             -alias williams-debug             | awk -F': ' '/SHA256:/{print $2; exit}')"

          APK_SHA="$("$APKSIGNER" verify --print-certs "$APK"             | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}')"

          echo "Keystore SHA-256: $KEYSTORE_SHA"
          echo "APK SHA-256:      $APK_SHA"

          test -n "$KEYSTORE_SHA"
          test -n "$APK_SHA"

          KEYSTORE_SHA_NORMALIZED="$(printf '%s' "$KEYSTORE_SHA" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          APK_SHA_NORMALIZED="$(printf '%s' "$APK_SHA" | tr -d ':' | tr '[:upper:]' '[:lower:]')"

          test "$KEYSTORE_SHA_NORMALIZED" = "$APK_SHA_NORMALIZED"

          echo "Signing certificate match: PASS"

          "$APKSIGNER" verify --verbose "$APK"

          echo "Persistent debug signing verification: PASS"

      - name: Generate SHA-256 checksums
        run: |
          set -euo pipefail

          sha256sum \
            app/build/outputs/apk/debug/app-debug.apk \
            > app/build/outputs/apk/debug/app-debug.apk.sha256

          sha256sum \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            > app/build/outputs/apk/release/app-release-unsigned.apk.sha256

          echo "=== SHA-256 ==="
          cat app/build/outputs/apk/debug/app-debug.apk.sha256
          cat app/build/outputs/apk/release/app-release-unsigned.apk.sha256

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v7
        with:
          name: williams-bot-debug-apk-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: williams-bot-release-unsigned-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/apk/release/app-release-unsigned.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        run: |
          {
            echo '## Android build complete'
            echo ''
            echo "Version code: ${{ github.run_number }}"
            echo ''
            echo '### APKs'
            echo '- Installable debug APK: `app-debug.apk`'
            echo '- Release APK: `app-release-unsigned.apk`'
            echo ''
            echo '### Signing'
            echo '- Debug: persistent GitHub Secret keystore'
            echo '- Release: existing release signing configuration when available'
          } >> "$GITHUB_STEP_SUMMARY"
