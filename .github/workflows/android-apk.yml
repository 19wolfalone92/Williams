name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Each commit validates its exact source tree; never cancel a different commit's APK build.
  group: android-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '8.14.6'
  # CI validation intentionally runs against the exact current main tree.
  ANDROID_PLATFORM: 'platforms;android-36'
  ANDROID_BUILD_TOOLS: 'build-tools;36.0.0'

jobs:
  build-apk:
    name: Build APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "${ANDROID_PLATFORM}" "${ANDROID_BUILD_TOOLS}"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          validate-wrappers: false
      - name: Restore persistent debug signing key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.WILLIAMS_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${DEBUG_KEYSTORE_B64:-}" ]; then
            echo "::error::WILLIAMS_DEBUG_KEYSTORE_B64 GitHub Secret is not configured."
            exit 1
          fi
          mkdir -p build
          printf '%s' "$DEBUG_KEYSTORE_B64" | base64 --decode > build/williams-debug.p12
          chmod 600 build/williams-debug.p12
      - name: Validate debug signing configuration
        env:
          WILLIAMS_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.WILLIAMS_DEBUG_KEYSTORE_PASSWORD }}
          WILLIAMS_DEBUG_KEYSTORE_B64: ${{ secrets.WILLIAMS_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -s build/williams-debug.p12
      # Release gate is the single pre-build contract check for every APK commit.
      - name: Run release contract gate
        run: python3 ci_release_gate.py
      - name: Validate quant Python sources
        run: |
          set -euo pipefail
          python3 -m py_compile feature_store.py ai_shadow.py cpcv_backtester.py stress_suite.py mock_exchange.py quant_models.py shap_explain.py derivatives_features.py shadow_execution.py quant_ml_pipeline.py
      - name: Quant integration marker
        run: |
          set -euo pipefail
          for f in feature_store.py ai_shadow.py cpcv_backtester.py stress_suite.py mock_exchange.py quant_models.py shap_explain.py derivatives_features.py shadow_execution.py quant_ml_pipeline.py; do test -f "$f"; done
      - name: Run required Android lint
        run: gradle --no-daemon :app:lintDebug --stacktrace

      - name: Run Android unit tests
        run: |
          set +e
          gradle --no-daemon :app:testDebugUnitTest --stacktrace 2>&1 | tee android-unit-tests.log
          rc=${PIPESTATUS[0]}
          set -e
          exit "$rc"
      - name: Upload Android unit-test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: williams-android-unit-test-diagnostics-${{ github.run_number }}
          path: |
            android-unit-tests.log
            app/build/test-results/testDebugUnitTest/**/*.xml
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Build debug APK
        env:
          WILLIAMS_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.WILLIAMS_DEBUG_KEYSTORE_PASSWORD }}
          WILLIAMS_DEBUG_KEYSTORE_B64: ${{ secrets.WILLIAMS_DEBUG_KEYSTORE_B64 }}
        run: |
          set +e
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee build-debug.log
          rc=${PIPESTATUS[0]}
          set -e
          exit "$rc"
      - name: Upload debug build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: williams-debug-build-log-${{ github.run_number }}
          path: build-debug.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease --stacktrace
      - name: Verify APK files
        run: |
          set -euo pipefail
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$DEBUG_APK"
          test -f "$RELEASE_APK"
      - name: Inspect APK metadata
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -E "package:|sdkVersion:|targetSdkVersion:"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/release/app-release-unsigned.apk | grep -E "package:|sdkVersion:|targetSdkVersion:"
      - name: Verify persistent debug keystore
        run: |
          set -euo pipefail
          test -s build/williams-debug.p12
      - name: Verify persistent debug APK signature
        env:
          WILLIAMS_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.WILLIAMS_DEBUG_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          KEYTOOL="$JAVA_HOME/bin/keytool"
          KEYSTORE_SHA="$("$KEYTOOL" -list -v -keystore build/williams-debug.p12 -storetype PKCS12 -storepass "$WILLIAMS_DEBUG_KEYSTORE_PASSWORD" -alias williams-debug | awk -F': ' '/SHA256:/{print $2; exit}')"
          APK_SHA="$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}')"
          test -n "$KEYSTORE_SHA"
          test -n "$APK_SHA"
          test "$(printf '%s' "$KEYSTORE_SHA" | tr -d ':' | tr '[:upper:]' '[:lower:]')" = "$(printf '%s' "$APK_SHA" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          "$APKSIGNER" verify --verbose "$APK"
      - name: Generate SHA-256 checksums
        run: |
          set -euo pipefail
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk > app/build/outputs/apk/release/app-release-unsigned.apk.sha256
          cat app/build/outputs/apk/debug/app-debug.apk.sha256
          cat app/build/outputs/apk/release/app-release-unsigned.apk.sha256
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v7
        with:
          name: williams-bot-debug-apk-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: williams-bot-release-unsigned-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/apk/release/app-release-unsigned.apk.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Build summary
        run: |
          {
            echo '## Android build complete'
            echo ''
            echo "Version code: ${{ github.run_number }}"
            echo ''
            echo '### APKs'
            echo '- Installable debug APK: `app-debug.apk`'
            echo '- Release APK: `app-release-unsigned.apk`'
          } >> "$GITHUB_STEP_SUMMARY"
