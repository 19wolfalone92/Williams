name: Williams Campaign CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: williams-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run deterministic safety and campaign tests
        run: |
          set -o pipefail
          python -m pytest -q \
            test_backtester.py \
            test_production_architecture.py \
            test_binance_usdm_futures_client.py \
            test_futures_campaign_execution.py \
            test_futures_testnet_release_gate.py \
            test_williams_directional_signals.py \
            test_android_remote_only.py \
            test_l2_slippage.py \
            test_hypothesis_engine.py \
            test_market_scanner.py \
            test_wave_engine.py \
            test_dynamic_scanner.py \
            test_portfolio_controller.py \
            test_multi_position_risk.py \
            test_multi_position_execution.py \
            test_portfolio_scanner.py \
            test_portfolio_scanner_atr.py \
            test_risk_engine.py \
            test_strategy_diagnostics.py \
            test_db_guard.py \
            test_db_isolation.py \
            test_atomic_real_db.py \
            test_atomic_switch_db_failure.py \
            test_atomic_switch_rollback.py \
            test_buy_safety.py \
            test_williams_book_alignment.py \
            test_book_wave_safety.py \
            test_trade_journal.py \
            test_multi_position_lifecycle.py \
            recovery_test.py \
            recovery_oco_failure_test.py \
            test_chaos_hardening.py \
            test_wave_safety_fields.py \
            test_binance_market_data.py \
            test_binance_json_shapes.py \
            tests/test_quant_layer.py \
            tests/test_quant_models.py \
            test_preflight_gate.py \
            test_execution_architecture.py \
            test_integration_bindings.py \
            test_testnet_release_gate.py \
            test_campaign_engine.py \
            test_campaign_execution.py \
            2>&1 | tee campaign-pytest-output.txt

  android:
    name: Android build and static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14.6"
          validate-wrappers: false
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build debug APK and run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: williams-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload lint report
        uses: actions/upload-artifact@v4
        with:
          name: williams-lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: warn
