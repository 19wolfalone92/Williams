name: Williams Campaign CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: williams-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt ruff
      - name: Check undefined names and syntax
        run: python -m ruff check --select F821,F822,F823,E9 .
      - name: Run release contract gate
        run: python ci_release_gate.py
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run deterministic safety and campaign tests
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee campaign-pytest-output.txt

  android:
    name: Android build and static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14.6"
          validate-wrappers: false
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build debug APK and run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: Print lint errors
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          report = Path("app/build/reports/lint-results-debug.xml")
          if report.exists():
              errors = [i for i in ElementTree.parse(report).getroot().findall("issue")
                        if i.get("severity") in ("Error", "Fatal")]
              print("Lint errors:", len(errors))
              for issue in errors:
                  print(issue.get("id"), issue.get("message"))
                  for location in issue.findall("location"):
                      print(location.get("file"), "line", location.get("line"))
          else:
              print("Lint XML not produced by this build.")
          PY
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: williams-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: williams-lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: warn
