name: Williams Core Final CI

on:
  push:
    branches: ["williams-core-final-20261008"]
  pull_request:
    branches: ["main"]
    paths:
      - "williams_*.py"
      - "campaign_*.py"
      - "strategy.py"
      - "test_williams_*.py"
      - "test_intraday_contract_integration.py"
      - ".github/workflows/williams-core-final.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Canonical Williams Core regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Compile core sources
        run: python -m compileall -q williams_*.py campaign_*.py strategy.py
      - name: Run canonical Core tests
        run: |
          python -m pytest -q             test_williams_intraday_core.py             test_williams_campaign_backtester.py             test_williams_final_system.py             test_intraday_contract_integration.py             test_campaign_engine.py             test_campaign_execution.py
      - name: Run full static safety audit
        run: python full_safety_audit.py
