name: Apply Williams book-alignment patch
on:
  push:
    branches:
      - codex/book-alignment-4.12.0
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode patch
        run: |
          set -euo pipefail
          base64 -d .codex/williams_alignment.patch.bz2.b64 | bzip2 -d > /tmp/williams_alignment.patch
          git apply --binary --whitespace=fix /tmp/williams_alignment.patch
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: align Williams strategy with trading books" || exit 0
          git push origin HEAD:$GITHUB_REF_NAME
