name: Android CI

on:
  push:
    branches:
      - main
      - futures-williams-campaign
  pull_request:
    branches:
      - main
      - futures-williams-campaign
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14.6"
          validate-wrappers: false

      # Invoke the pinned Gradle distribution directly. The checked-in wrapper JAR
      # is not in Gradle's trusted checksum set, so CI must not execute it.
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: williams-futures-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
