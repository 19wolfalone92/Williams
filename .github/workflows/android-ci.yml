name: Android CI

on:
  push:
    branches:
      - main
      - futures-williams-campaign
  pull_request:
    branches:
      - main
      - futures-williams-campaign
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14.6"
          validate-wrappers: false

      # Invoke the pinned Gradle distribution directly. The checked-in wrapper JAR
      # is not in Gradle's trusted checksum set, so CI must not execute it.
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      # This job is for static and unit validation only. Its Gradle default
      # debug key is ephemeral and does NOT match the stable installer signer.
      # Publishing the output here used to offer a second, non-upgradeable
      # APK for the same com.williamsbot.debug package.
      - name: Report validation-only build
        if: success()
        run: |
          {
            echo "### Android CI (validation only)"
            echo "Unit tests and debug compilation passed."
            echo ""
            echo "Do not install this job's local APK: it is not an update artifact."
            echo "Download the signed APK from **Build Android APK** workflow only."
          } >> "$GITHUB_STEP_SUMMARY"
