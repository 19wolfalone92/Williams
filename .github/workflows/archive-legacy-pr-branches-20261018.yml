name: One-time closure of legacy version branches
on:
  push:
    branches: [main]
    paths: ['.github/workflows/archive-legacy-pr-branches-20261018.yml']
permissions:
  contents: write
  pull-requests: read
jobs:
  cleanup:
    if: github.repository == '19wolfalone92/Williams'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Back up exact branch commits as tags and remove dead PR branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prs_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100")"
          while IFS='|' read -r branch expected; do
            [[ -n "$branch" ]] || continue
            current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq .object.sha)"
            [[ "$current" == "$expected" ]] || { echo "SKIP changed $branch"; continue; }
            in_use="$(jq -r --arg b "$branch" 'any(.[]; .head.ref == $b or .base.ref == $b)' <<< "$prs_json")"
            [[ "$in_use" == "false" ]] || { echo "SKIP in-use $branch"; continue; }
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/branch-archive-20261018/${branch}" -f sha="$expected" >/dev/null
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            echo "Archived and removed $branch"
          done <<'BRANCHES'
          feat/williams-campaign-engine-1|39da5ca8abab5c392ee2209782990d8d7350929e
          campaign-engine-4-24|f79bd0a31af03c1e8392c6ce1c8c9a5bc0b63a77
          williams-4.24-hardening|8e08f97882d65b0e4163e3cfb10b8c7a8d5d0d9f
          campaign-hardening-20261008|204b8ed18597a74e9b9e369176308cde0837d77d
          williams-intraday-core-1.0|3a681a37359f4ca9bd78634690eb1900dd152a80
          williams-core-final-20261008|9f35fcd4ee714096e5e8bc59612a9570b6a8c1b9
          fix/release-gate-version-4-25-0|3390895070473d2230044d88f623ed17edcd0c73
          BRANCHES
